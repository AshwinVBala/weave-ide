<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Amber Thread Gradient -->
    <linearGradient id="weave-amber" x1="10" y1="20" x2="60" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="40%" stop-color="#FF9D00" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>

    <!-- Cyan Thread Gradient -->
    <linearGradient id="weave-cyan" x1="90" y1="20" x2="40" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#0091EA" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="weave-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient dark base disc -->
  <circle cx="50" cy="50" r="46" fill="#0E121E" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Outer subtle orbital weave ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(0, 229, 255, 0.12)" stroke-width="1" stroke-dasharray="4 3" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255, 157, 0, 0.12)" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Glow Underlayers -->
  <g opacity="0.4" filter="url(#weave-glow)">
    <!-- Cyan Glow -->
    <path
      d="M 78 26 C 74 52, 64 78, 56 78 C 48 78, 44 54, 40 42 C 36 30, 28 30, 24 42 C 20 54, 16 76, 12 76"
      stroke="#00E5FF"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Amber Glow -->
    <path
      d="M 22 26 C 26 52, 36 78, 44 78 C 52 78, 56 54, 60 42 C 64 30, 72 30, 76 42 C 80 54, 84 76, 88 76"
      stroke="#FF9D00"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Cyan Loop (Under/Left-Over thread) -->
  <path
    d="M 78 26 C 74 52, 64 78, 56 78 C 48 78, 44 54, 40 42 C 36 30, 28 30, 24 42 C 20 54, 16 76, 12 76"
    stroke="url(#weave-cyan)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Amber Loop (Over/Right-Over thread forming the Interwoven W) -->
  <path
    d="M 22 26 C 26 52, 36 78, 44 78 C 52 78, 56 54, 60 42 C 64 30, 72 30, 76 42 C 80 54, 84 76, 88 76"
    stroke="url(#weave-amber)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Precision crossover nodes -->
  <circle cx="44" cy="48" r="3" fill="#00E5FF" opacity="0.9" filter="url(#weave-glow)" />
  <circle cx="56" cy="48" r="3" fill="#FF9D00" opacity="0.9" filter="url(#weave-glow)" />
  <circle cx="50" cy="78" r="3.5" fill="#FFFFFF" opacity="0.95" />
</svg>
