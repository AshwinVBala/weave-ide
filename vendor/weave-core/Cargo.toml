[package]
name = "weave-core"
version = "0.1.0"
edition = "2021"
authors = ["Weave Authors"]
description = "Core compiler and toolchain for the Weave programming language"
license = "MIT OR Apache-2.0"

[[bin]]
name = "weave"
path = "src/main.rs"

[lib]
name = "weave_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
logos = "0.14"
rowan = "0.15"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
wasm-bindgen = "=0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
pretty_assertions = "1.4"

