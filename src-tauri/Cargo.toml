[package]
name = "weave-ide"
version = "0.1.0"
description = "Cross-platform Desktop IDE for the Weave Programming Language"
edition = "2021"

[lib]
name = "weave_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
