      <stop stop-color="#151923"/>
      <stop offset="0.52" stop-color="#090B11"/>
      <stop offset="1" stop-color="#030407"/>
    </linearGradient>
    <linearGradient id="amber" x1="220" y1="220" x2="694" y2="848" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD45C"/>
